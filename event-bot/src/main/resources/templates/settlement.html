<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>정산 이벤트 설정 - 관리자</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; margin: 40px; background-color: #f8f9fa; color: #333; }
        .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .nav-back { margin-bottom: 20px; display: inline-block; text-decoration: none; color: #3498db; font-weight: bold; }
        h1 { color: #2c3e50; margin-top: 0; padding-bottom: 15px; border-bottom: 2px solid #f1f3f5; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #495057; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ced4da; box-sizing: border-box; font-size: 1rem; }
        .status-box { padding: 15px; border-radius: 8px; font-weight: bold; margin-bottom: 25px; display: flex; align-items: center; justify-content: space-between; }
        .status-box.running { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .status-box.idle { background-color: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        .actions { display: flex; gap: 12px; margin-top: 25px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; font-size: 1rem; transition: background 0.2s; }
        .btn-update { background-color: #3498db; }
        .btn-update:hover { background-color: #2980b9; }
        .btn-start { background-color: #2ecc71; }
        .btn-start:hover { background-color: #27ae60; }
        .btn-stop { background-color: #e74c3c; }
        .btn-stop:hover { background-color: #c0392b; }
        .info-text { font-size: 0.85rem; color: #6c757d; margin-top: 6px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        
        /* 시뮬레이션 지표 스타일 */
        .metrics-container { margin-top: 30px; border-top: 2px solid #f1f3f5; pt: 20px; }
        .metric-card { background: #fff; border: 1px solid #e9ecef; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .metric-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; font-weight: bold; }
        .progress-bar-bg { background: #e9ecef; border-radius: 10px; height: 12px; width: 100%; overflow: hidden; }
        .progress-bar-fill { background: #3498db; height: 100%; width: 0%; transition: width 0.3s ease; }
        .progress-bar-fill.error { background: #e74c3c; }
        .metric-value { font-size: 1.2rem; font-weight: bold; color: #2c3e50; }
        .metric-label { font-size: 0.8rem; color: #6c757d; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="nav-back">← 대시보드로 돌아가기</a>
        <h1>정산 이벤트 시뮬레이션 설정</h1>
        
        <div id="statusBox" th:class="${settings.running} ? 'status-box running' : 'status-box idle'">
            <span>현재 상태: <span id="statusText" th:text="${settings.running} ? '시뮬레이션 중' : '대기 중'">대기 중</span></span>
            <span th:if="${settings.running}" id="runningDot" style="font-size: 0.8rem;">● 처리 중</span>
        </div>

        <form action="/settlement/update-settings" method="post" id="settingsForm">
            <div class="grid-3">
                <div class="form-group">
                    <label for="count">발행 횟수</label>
                    <input type="number" id="count" name="count" th:value="${settings.eventCount}" min="1" required>
                </div>
                <div class="form-group">
                    <label for="interval">발행 간격 (초)</label>
                    <input type="number" id="interval" name="interval" th:value="${settings.intervalSeconds}" min="0" required>
                </div>
                <div class="form-group">
                    <label for="perBatch">1회당 이벤트 수</label>
                    <input type="number" id="perBatch" name="perBatch" th:value="${settings.eventsPerBatch}" min="1" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="errorProb">오류 데이터 발생 확률 (0.0 ~ 1.0)</label>
                <input type="number" step="0.01" id="errorProb" name="errorProb" th:value="${settings.errorProbability}" min="0" max="1" required>
            </div>
            
            <button type="submit" class="btn-update" id="btnUpdate" th:disabled="${settings.running}">설정 저장</button>
        </form>

        <div class="actions">
            <div style="flex: 1;" id="startFormContainer" th:styleappend="${settings.running} ? 'display:none' : ''">
                <button type="button" class="btn-start" onclick="controlSimulation('start')">시뮬레이션 시작</button>
            </div>
            
            <div style="flex: 1;" id="stopFormContainer" th:styleappend="${!settings.running} ? 'display:none' : ''">
                <button type="button" class="btn-stop" onclick="controlSimulation('stop')">즉시 중단</button>
            </div>
        </div>

        <!-- 시뮬레이션 지표 영역 -->
        <div class="metrics-container" id="metricsContainer" th:style="${settings.running || settings.processedCount > 0} ? '' : 'display:none'">
            <div class="metric-card">
                <div class="metric-header">
                    <span>전체 진행률</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progressBar" class="progress-bar-fill"></div>
                </div>
                <div style="margin-top: 8px; text-align: right;">
                    <span class="metric-label">발행 현황: </span>
                    <span class="metric-value" id="progressCount">0 / 0</span>
                </div>
            </div>

            <div class="metric-card">
                <div class="metric-header">
                    <span>오류 데이터 발생 현황</span>
                    <span id="errorRateText">오류율: 0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="errorBar" class="progress-bar-fill error"></div>
                </div>
                <div style="margin-top: 8px; text-align: right;">
                    <span class="metric-label">오류 수: </span>
                    <span class="metric-value" id="errorCountText">0</span>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        let pollingInterval = null;

        function updateUI(data) {
            const isRunning = data.running;
            
            // 상태 배지 업데이트
            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            const runningDot = document.getElementById('runningDot');
            
            if (isRunning) {
                statusBox.className = 'status-box running';
                statusText.innerText = '시뮬레이션 중';
                if (!runningDot) {
                    statusBox.insertAdjacentHTML('beforeend', '<span id="runningDot" style="font-size: 0.8rem;">● 처리 중</span>');
                }
                document.getElementById('startFormContainer').style.display = 'none';
                document.getElementById('stopFormContainer').style.display = 'block';
                document.getElementById('btnUpdate').disabled = true;
            } else {
                statusBox.className = 'status-box idle';
                statusText.innerText = '대기 중';
                if (runningDot) runningDot.remove();
                document.getElementById('startFormContainer').style.display = 'block';
                document.getElementById('stopFormContainer').style.display = 'none';
                document.getElementById('btnUpdate').disabled = false;
                
                if (pollingInterval) {
                    clearInterval(pollingInterval);
                    pollingInterval = null;
                }
            }

            // 지표 업데이트
            if (data.processedCount > 0 || isRunning) {
                document.getElementById('metricsContainer').style.display = 'block';
                
                // 진행도
                const total = data.totalTarget;
                const processed = data.processedCount;
                const percent = total > 0 ? Math.round((processed / total) * 100) : 0;
                
                document.getElementById('progressBar').style.width = percent + '%';
                document.getElementById('progressPercent').innerText = percent + '%';
                document.getElementById('progressCount').innerText = `${processed} / ${total}`;
                
                // 오류 현황
                const errors = data.errorCount;
                const errorRate = processed > 0 ? Math.round((errors / processed) * 100) : 0;
                
                document.getElementById('errorBar').style.width = errorRate + '%';
                document.getElementById('errorRateText').innerText = `현재 오류율: ${errorRate}%`;
                document.getElementById('errorCountText').innerText = errors;
            }
        }

        function controlSimulation(action) {
            fetch('/settlement/' + action, { method: 'POST' })
                .then(() => {
                    if (action === 'start') {
                        if (!pollingInterval) {
                            pollingInterval = setInterval(fetchStatus, 1000);
                        }
                    }
                    fetchStatus();
                })
                .catch(error => console.error('Error controlling simulation:', error));
        }

        function fetchStatus() {
            fetch('/settlement/status')
                .then(response => response.json())
                .then(data => updateUI(data))
                .catch(error => console.error('Error fetching status:', error));
        }

        // 초기 로드 시 실행 중이면 폴링 시작
        const initialRunning = [[${settings.running}]];
        if (initialRunning) {
            pollingInterval = setInterval(fetchStatus, 1000);
        }
    </script>
</body>
</html>
