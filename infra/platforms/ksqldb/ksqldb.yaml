apiVersion: apps/v1
kind: Deployment
metadata:
  name: ksqldb-server
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ksqldb-server
  template:
    metadata:
      labels:
        app: ksqldb-server
    spec:
      containers:
      - name: ksqldb-server
        image: confluentinc/cp-ksqldb-server:7.6.1
        ports:
        - containerPort: 8088
        env:
        # kafka-cluster.yaml의 Kafka 리소스명(my-cluster)에서 Strimzi가 자동 생성하는 bootstrap 서비스
        - name: KSQL_BOOTSTRAP_SERVERS
          value: "my-cluster-kafka-bootstrap:9092"
        - name: KSQL_LISTENERS
          value: "http://0.0.0.0:8088"
        - name: KSQL_KSQL_SERVICE_ID
          value: "ecommerce_ksql_"
        # 내부 토픽(offsets, configs 등) 복제본 수 - kafka-cluster.yaml의 replication factor와 맞춤
        - name: KSQL_KSQL_STREAMS_REPLICATION_FACTOR
          value: "3"
        - name: KSQL_KSQL_INTERNAL_TOPIC_REPLICAS
          value: "3"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: ksqldb-server
  namespace: kafka
spec:
  selector:
    app: ksqldb-server
  ports:
    - protocol: TCP
      port: 8088
      targetPort: 8088