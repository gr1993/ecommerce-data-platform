spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 123123
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9091,localhost:9092,localhost:9094}
    consumer:
      group-id: settlement-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      enable-auto-commit: false
      max-poll-records: 10
      properties:
        spring.json.trusted.packages: "com.example.*"
        spring.json.type.mapping: >
          OrderCreatedEvent:com.example.settlementservice.domain.event.OrderCreatedEvent,
          PaymentConfirmedEvent:com.example.settlementservice.domain.event.PaymentConfirmedEvent,
          OrderCancelledEvent:com.example.settlementservice.domain.event.OrderCancelledEvent,
          PaymentCancelledEvent:com.example.settlementservice.domain.event.PaymentCancelledEvent

    producer: # (DLQ 전송용)
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        acks: all
        enable.idempotence: true